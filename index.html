<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<!-- Ben's background canvas (fixed, behind everything) -->
<div class="main-bg">
    <div class="canvas">
        <canvas class="canvas-2"></canvas>
    </div>
</div>

<!-- Ben's hero canvas (fullscreen hero section) -->
<div class="hero" id="hero">
    <div class="canvas">
        <canvas class="connecting-dots"></canvas>
    </div>
    <!-- Your content sits here, on top of the particles -->
    <div class="hero-content">
        <h1>Hallo, ich heisse Laurens</h1>
        <h1>Ich baue, deploye und betreibe</h1>
        <button id="theme-toggle">Design wechseln</button>
    </div>
</div>

<div class="tabs" id="tabs">

</div>

<!-- The rest of your portfolio goes below -->
<main class="page-content">
    <!-- Platzhalter – füge deine Sektionen hier ein -->
    <section id="about">
        <h2>Über mich</h2>
        <p>Hier kommt dein Inhalt.</p>
    </section>
    <section id="projects">
        <h2>Projekte</h2>
    </section>
</main>

<div class="footer">
    footer
</div>

</body>
</html>
