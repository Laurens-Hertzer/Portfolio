<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<!-- Ben's background canvas (fixed, behind everything) -->
<div class="main-bg">
    <div class="canvas">
        <canvas class="canvas-2"></canvas>
    </div>
</div>

<!-- Ben's hero canvas (fullscreen hero section) -->
<div class="hero" id="hero">
    <div class="canvas">
        <canvas class="connecting-dots"></canvas>
    </div>
    <!-- Your content sits here, on top of the particles -->
    <div class="hero-content">
        <button class="theme-toggle" id="theme-toggle" aria-label="Theme wechseln">
            <!-- Sonne Icon -->
            <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>

            <!-- Mond Icon -->
            <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
        <h1>Hallo, ich heisse Laurens</h1>
        <h1>Ich baue, deploye und betreibe</h1>
    </div>
</div>

<div class="tabs" id="tabs">

</div>

<!-- The rest of your portfolio goes below -->
<main class="page-content">
    <!-- Platzhalter – füge deine Sektionen hier ein -->
    <section id="about">
        <h2>Über mich</h2>
        <p>Hier kommt dein Inhalt.</p>
    </section>
    <section id="projects">
        <h2>Projekte</h2>
    </section>
</main>

<div class="footer">
    footer
</div>

</body>
</html>
